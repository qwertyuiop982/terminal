<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal 远程调试</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#111418;color:#e4ebf0}body{max-width:1050px;margin:auto;padding:20px}h1{font-size:24px;margin-bottom:8px}h2{font-size:18px}section{background:#1b232c;border:1px solid #34414e;border-radius:10px;padding:16px;margin:16px 0}label{display:block;margin:10px 0 5px}input,textarea,button,select{font:inherit;border:1px solid #526174;border-radius:6px;background:#111923;color:inherit;padding:9px;box-sizing:border-box}input,textarea{width:100%}button{cursor:pointer;background:#253b51;margin:4px 4px 4px 0}button:hover{background:#335572}textarea{font:14px monospace;min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10161d;padding:12px;border-radius:6px;max-height:500px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #34414e;padding:8px;overflow-wrap:anywhere}td:last-child{min-width:190px}.row{display:flex;gap:12px;align-items:center}.row>input{flex:1}.hint{color:#b0bfce;font-size:13px}#message{white-space:pre-wrap;color:#ffd193}#editor{min-height:240px}.table-wrap{overflow:auto}button.danger{background:#5a2935}@media(max-width:600px){body{padding:10px}.row{flex-wrap:wrap}.row>input{flex-basis:100%}td,th{padding:6px}}
</style><script src="/remote.js" defer></script></head><body>
<h1>Terminal 远程调试</h1><div class="hint">命令与文件操作使用终端 App 的权限。</div>
<section><label for="token">访问令牌（在 App 顶部“连接信息”中查看）</label><div class="row"><input id="token" type="password" autocomplete="off"><button id="connect">连接</button><button id="logout">退出</button></div><div id="status" class="hint">尚未连接</div><div id="message" role="status"></div></section>
<section><h2>执行命令</h2><label for="cwd">工作目录</label><input id="cwd" value="/data/data/com.terminal/files/home"><label for="command">命令</label><textarea id="command" spellcheck="false" placeholder="例如：apt --version"></textarea><label for="timeout">超时（秒，最多 300）</label><input id="timeout" type="number" value="30" min="1" max="300"><button id="execute">执行</button><button id="cancel">取消</button><pre id="output">等待命令</pre></section>
<section><h2>文件目录</h2><label for="directory">目录路径</label><div class="row"><input id="directory" value="/data/data/com.terminal/files/home"><button id="browse">打开</button><button id="parent">上一级</button></div><button id="private">内部存储</button><button id="external">外部存储</button><button id="mkdir">新建目录</button><button id="newFile">新建文件</button><button id="permissions">检查目录权限</button><label for="upload">上传文件到当前目录（单次最多 16 MiB）</label><input id="upload" type="file"><div class="table-wrap"><table><thead><tr><th>名称</th><th>大小 / 权限</th><th>操作</th></tr></thead><tbody id="entries"></tbody></table></div><button id="more">下一页</button></section>
<section><h2>编写文件</h2><label for="editPath">文件路径</label><input id="editPath"><label for="editor">UTF-8 内容</label><textarea id="editor" spellcheck="false"></textarea><button id="save">保存</button><button id="download">下载</button></section>
<section><h2>复制与移动</h2><label for="source">源路径</label><input id="source"><label for="destination">目标完整路径（可在内部或外部存储）</label><input id="destination"><button id="copy">复制</button><button id="move">移动</button><div class="hint">目标必须尚不存在；跨存储移动先完成并校验复制，再删除源。</div></section>
</body></html>
